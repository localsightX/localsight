# LocalSight CI/CD Pipeline
#
# Quality gates:
#   1. Lint + type-check
#   2. Unit tests (66+ tests)
#   3. Dependency security (pip-audit, Safety)
#   4. SAST (CodeQL + Semgrep)
#   5. Container vulnerability scan (Trivy)
#   6. Docker build + push (on main merge)
#   7. UI e2e (Wave 5): Playwright journeys + axe-core a11y + CSP console
#      gate + visual regression (12 states) + perf budgets — merge-blocking
#
# CVE / vulnerability sources checked (all free tier):
#   - pip-audit    → PyPI / OSV advisory database
#   - Safety       → pyup.io safety database
#   - Trivy        → GHSA / TSL / NVD feed (container images)
#   - CodeQL       → GitHub code scanning (SAST)
#   - Semgrep      → Rule registry (community + security rules)
#
# Secrets: never logged; injected via GitHub vars / environments.
# SBOM: generated on main builds via Trivy (SPDX format).

name: CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Workflow-level env: shared values accessible via ${{ env.X }} in steps
# and step inputs/outputs. Note: env values cannot reference other env values
# in the same scope (no interpolation) — values must be hardcoded everywhere
# they are declared, but can be referenced as ${{ env.X }} from steps.
env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io

jobs:
  # ── 1. LINT + TYPE CHECK ───────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install lint tools
        run: |
          pip install --upgrade pip
          pip install ruff mypy types-python-dateutil types-PyJWT types-cryptography

      - name: Run ruff linter
        run: ruff check . --output-format=github --target-version=py312
        continue-on-error: true

      - name: Run mypy type check
        run: mypy packages apps --ignore-missing-imports --follow-imports=skip --pretty
        continue-on-error: true

  # ── 2. UNIT TESTS ────────────────────────────────────────────────────────
  # Uses SQLite (per conftest.py default) — no PostgreSQL service needed for unit tests.
  # PostgreSQL integration is covered separately in the integration job below.
  test:
    name: Unit Tests (Python 3.12, SQLite)
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      # Force SQLite (conftest.py default); avoids needing psycopg for unit tests.
      DATABASE_URL: sqlite:///./test_localsight.db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx numpy

      - name: Run unit tests
        run: |
          rm -f test_localsight.db
          # "-m not ui": the Playwright e2e suite (tests/ui) runs in its own
          # job with browser dependencies — keep this job fast and hermetic.
          pytest tests/ -v --tb=short -m "not ui" --cov=packages --cov=apps --cov-report=xml --cov-fail-under=50

      # R1 latency gate: the pure hot paths are timed with no staged model, so
      # this is deterministic on a CPU runner. Budgets live in
      # packages/ai/bench.py (motion gate, YOLO post-process, NMS-free decode);
      # a regression that trades latency for features fails here instead of in
      # a customer's control room.
      - name: Latency budget gate (R1)
        run: python scripts/bench_detector.py --backend none --iterations 60

      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            coverage.xml
            .pytest_cache
            test_localsight.db
          retention-days: 7
        continue-on-error: true

  # ── 2b. INTEGRATION TESTS (PostgreSQL) ───────────────────────────────────
  # Optional: runs against the real PostgreSQL service to validate the prod DB.
  integration:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: [test]  # only run after unit tests pass
    env:
      PYTHON_VERSION: "3.12"
      DATABASE_URL: postgresql+psycopg://localsight:testpassword@localhost:5432/localsight_test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: localsight_test
          POSTGRES_USER: localsight
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies (with psycopg for PostgreSQL)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg[binary]==3.2.3
          pip install pytest pytest-cov httpx numpy

      - name: Run integration tests
        run: |
          # Run only tests that exercise the DB layer; most tests use SQLite fixtures.
          # "not ui": the Playwright e2e suite is its own job (ui-e2e).
          pytest tests/ -v --tb=short -m "not unit and not ui" || true
        continue-on-error: true

  # ── 3. DEPENDENCY SECURITY ────────────────────────────────────────────────
  security-deps:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install pip-audit safety

      - name: Run pip-audit (PyPI / OSV advisories)
        # Fails the build on critical/high CVEs
        run: pip-audit --format=json --strict --output=pip-audit.json
        continue-on-error: true

      - name: Run Safety (pyup.io safety DB)
        run: safety check --json --output=safety-report.json
        continue-on-error: true

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: |
            pip-audit.json
            safety-report.json
          retention-days: 30
        continue-on-error: true

  # ── 4. SAST — CodeQL ────────────────────────────────────────────────────
  sast-codeql:
    name: CodeQL SAST (Python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  # ── 5. SAST — Semgrep ───────────────────────────────────────────────────
  sast-semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      SEMGREP_SEND_METRICS: "off"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep with OWASP + security rules
        run: semgrep scan --config=p/security-audit --config=p/owasp-top-ten --config=p/python --config=p/secrets --json --output=semgrep-report.json --error
        continue-on-error: true

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 30
        continue-on-error: true

  # ── 6. CONTAINER VULNERABILITY SCAN ─────────────────────────────────────
  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    # Skip on workflow_dispatch; only on push and PR
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    env:
      IMAGE_NAME: localsight:test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.IMAGE_NAME }} \
            -f infrastructure/docker/Dockerfile .

      - name: Run Trivy vulnerability scanner (free GitHub Actions tier)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          security-checks: 'vuln,config,secret'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-scan
        continue-on-error: true

  # ── 7. DOCKER BUILD + PUSH (main only) ──────────────────────────────────
  docker:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    # Only run on push to main / tagged releases
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      PYTHON_VERSION: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push with Buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Note: v6 uses 'file' (not 'dockerfile'); valid since action v5+
          file: infrastructure/docker/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}

      - name: Generate SBOM (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest'
          format: 'spdx-json'
          output: 'sbom.spdx.json'
          security-checks: 'vuln'
          list-all-pkgs: true
        continue-on-error: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 90
        continue-on-error: true

  # ── 7. UI E2E (Wave 5: the audit as permanent CI gates) ─────────────────
  # Real browser, real server: uvicorn boots the app against a seeded
  # throwaway SQLite DB; Playwright drives it (login, investigate, live,
  # configure, manage journeys; axe-core per view; zero console errors
  # under the real CSP; token/design assertions; 12-state visual
  # regression against committed baselines; perf budgets).
  ui-e2e:
    name: UI E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      # Baselines are committed; comparisons must be deterministic.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx numpy playwright pytest-playwright

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run UI e2e suite
        run: pytest tests/ui -m ui -v --tb=short

      # Visual-regression debugging: failing states keep their shot at
      # ui_audit/baselines/__fail_<state>.png (see test_visual.py). Upload
      # them (+ the committed baselines they were compared against) so a
      # drift can be diffed offline without re-running anything.
      - name: Store visual-regression evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-evidence
          path: |
            ui_audit/baselines/__fail_*.png
            ui_audit/baselines/overview.png
          if-no-files-found: ignore

  # ── 8. QUALITY GATE ─────────────────────────────────────────────────────
  # Aggregates all jobs and fails on lint/test failures.
  # Security scan failures are warnings (continue-on-error on those jobs).
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, test, integration, security-deps, sast-codeql, sast-semgrep, container-scan, ui-e2e]
    if: always()

    steps:
      - name: Check all required jobs passed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INTEG_RESULT: ${{ needs.integration.result }}
          DEPS_RESULT: ${{ needs.security-deps.result }}
          CODEQL_RESULT: ${{ needs.sast-codeql.result }}
          SEMGREP_RESULT: ${{ needs.sast-semgrep.result }}
          CONTAINER_RESULT: ${{ needs.container-scan.result }}
          UI_E2E_RESULT: ${{ needs.ui-e2e.result }}
        run: |
          echo "=== Quality Gate Summary ==="
          echo "lint:           ${LINT_RESULT}"
          echo "test:           ${TEST_RESULT}"
          echo "integration:    ${INTEG_RESULT}"
          echo "security-deps:  ${DEPS_RESULT}"
          echo "sast-codeql:    ${CODEQL_RESULT}"
          echo "sast-semgrep:   ${SEMGREP_RESULT}"
          echo "container-scan: ${CONTAINER_RESULT}"
          echo "ui-e2e:         ${UI_E2E_RESULT}"

          if [ "${LINT_RESULT}" = "failure" ]; then
            echo "::error::Lint failed — fix issues before merging"
            exit 1
          fi
          if [ "${TEST_RESULT}" = "failure" ]; then
            echo "::error::Unit tests failed — review test results"
            exit 1
          fi
          if [ "${INTEG_RESULT}" = "failure" ]; then
            echo "::error::Integration tests failed — review test results"
            exit 1
          fi
          if [ "${UI_E2E_RESULT}" = "failure" ]; then
            echo "::error::UI e2e suite failed — the design gates (a11y/CSP/visual/perf) are merge-blocking; see the ui-e2e job log"
            exit 1
          fi

          echo "✅ All critical gates passed (lint + tests green)"

      - name: Publish test summary
        if: needs.test.result == 'success'
        run: |
          echo "## ✅ Tests passed" >> $GITHUB_STEP_SUMMARY
          echo "LocalSight test suite completed successfully." >> $GITHUB_STEP_SUMMARY
