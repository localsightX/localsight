# LocalSight — local-first deployment (Docker Compose).
#
# Brings up: PostgreSQL (+pgvector), the API, the AI/video worker, and an nginx
# reverse proxy (TLS termination + security headers). Stores data on local
# volumes. No cloud dependencies; the system runs fully offline.
#
# Secrets: use ./config.env (git-ignored) or Docker secrets. Never commit them.
# Generate a config with:  python scripts/gen_env.py  (writes .env)
#
# Usage:
#   docker compose -f infrastructure/compose/docker-compose.yml --env-file .env up --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: localsight
      POSTGRES_USER: localsight
      # Use a Docker secret / real password in production, not this placeholder.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localsight"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://localsight:${DB_PASSWORD:-changeme}@postgres:5432/localsight
      JWT_SECRET: ${JWT_SECRET}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /app/data/storage
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      SSRF_ALLOWLIST: ${SSRF_ALLOWLIST:-}
      AI_DETECTOR: ${AI_DETECTOR:-reference}
      AI_IDENTITY_RECOGNITION_ENABLED: ${AI_IDENTITY_RECOGNITION_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@localsight.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-changeme}
      # Static token Prometheus presents when scraping /api/system/metrics
      # (must match infrastructure/monitoring/prometheus.yml credentials).
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
    volumes:
      - storage:/app/data/storage
      - ../../models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    # The worker package has no __main__; its entry point is
    # apps.worker.main:main (`python -m apps.worker` fails with
    # "cannot be directly executed").
    command: python -c "from apps.worker.main import main; main()"
    environment:
      DATABASE_URL: postgresql+psycopg://localsight:${DB_PASSWORD:-changeme}@postgres:5432/localsight
      JWT_SECRET: ${JWT_SECRET}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /app/data/storage
      # The worker is the process that actually DIALS cameras, so it needs the
      # same SSRF allowlist as the api. Without it every private-LAN camera is
      # rejected when the frame source is built (and the camera thread dies
      # silently): the api would accept the camera while the worker never
      # ingested a single frame.
      SSRF_ALLOWLIST: ${SSRF_ALLOWLIST:-}
      AI_DETECTOR: ${AI_DETECTOR:-reference}
      AI_IDENTITY_RECOGNITION_ENABLED: ${AI_IDENTITY_RECOGNITION_ENABLED:-false}
      RECORD_SEGMENT_SECONDS: ${RECORD_SEGMENT_SECONDS:-300}
    volumes:
      - storage:/app/data/storage
      # `./models` resolves relative to THIS file (infrastructure/compose/models,
      # which does not exist) — mount the repo's staged model registry instead.
      - ../../models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  storage:
